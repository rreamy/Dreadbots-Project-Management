spring.application.name=DreadbotsProjectManagement

server.port=8080

# Database config
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/dreadbots_pm}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA config
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Security
jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-value}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.dreadbots=DEBUG
